<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GATK gCNV · Baselines{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=asset_version('app.css')) }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.index') }}"><span class="brand-mark">g</span><span>gCNV <small>BASELINE STUDIO</small></span></a>
    <nav class="header-nav"><a href="{{ url_for('main.index') }}">Proyectos</a><a href="{{ url_for('main.jobs_page') }}">Jobs</a></nav>
  </header>
  <main class="page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}<div class="flash-stack">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js', v=asset_version('app.js')) }}" defer></script>
</body>
</html>
